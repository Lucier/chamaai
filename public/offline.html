<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f6b73">
  <meta name="robots" content="noindex">
  <title>Sem conexão | Chama Aí</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f8;color:#10242b;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;text-align:center}
    main{max-width:380px}
    .logo{width:72px;height:72px;margin:0 auto 20px;border-radius:18px;display:grid;place-items:center;
      background:linear-gradient(135deg,#0f6b73,#14919b)}
    .logo svg{width:38px;height:38px}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0 0 24px;color:#5b6b72}
    button{min-height:44px;padding:12px 24px;border:0;border-radius:10px;background:#0f6b73;color:#fff;
      font:600 15px system-ui,sans-serif;cursor:pointer}
    button:hover{filter:brightness(.9)}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </div>
    <h1>Você está sem conexão</h1>
    <p>O Chama Aí precisa de internet para buscar os profissionais. Confira o Wi-Fi ou os dados do celular e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
